[package]
name = "rust_diff_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust_diff_cli"
path = "src/main.rs"

[dependencies]
similar = { version = "2.6.0", features = ["unicode", "serde"] }
dissimilar = "1.0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "=1.12.0"
unicode-normalization = "0.1.24"
